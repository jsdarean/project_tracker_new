<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目详情</title>
  <link rel="stylesheet" href="style.css?v=26">
  <style>
    .detail-section { margin-bottom: var(--space-lg); }
    .detail-section h2 {
      font-size: 16px;
      font-weight: 500;
      color: var(--ink);
      padding: var(--space-md) var(--space-lg) 0;
      margin: 0 0 var(--space-sm);
    }
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: var(--space-md) var(--space-xl);
      padding: 0 var(--space-lg) var(--space-lg);
    }
    .detail-item { display: flex; flex-direction: column; gap: 2px; }
    .detail-item .label { font-size: 12px; color: var(--ink-mute); }
    .detail-item .value { font-size: 14px; color: var(--ink); word-break: break-all; white-space: pre-wrap; }
    .detail-actions {
      display: flex;
      gap: var(--space-md);
      padding: var(--space-lg);
      border-top: 1px solid var(--hairline);
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="hero-mesh" aria-hidden="true"></div>
    <div class="container hero-content">
      <header class="page-header">
        <div class="page-title">
          <h1 id="pageTitle">项目详情</h1>
          <p id="pageSubtitle"></p>
        </div>
        <a href="index.html" class="btn-secondary settings-btn">返回列表</a>
      </header>
    </div>
  </div>

  <main class="container">
    <div id="loading" class="loading card">加载中...</div>
    <div id="error" class="error card" style="display: none;"></div>

    <div id="detailCard" class="card" style="display: none;">
      <div id="detailBody"></div>
      <div class="detail-actions">
        <a id="editLink" href="#" class="btn-primary">编辑</a>
        <a href="index.html" class="btn-secondary">返回列表</a>
      </div>
    </div>
  </main>

  <script src="detail.js"></script>
</body>
</html>
