<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>项目详情</title>
  <link rel="stylesheet" href="style.css?v=29">
  <style>
    .detail-section { margin-bottom: var(--space-lg); }
    .detail-section h2 {
      font-size: 16px;
      font-weight: 500;
      color: var(--ink);
      padding: var(--space-md) var(--space-lg) 0;
      margin: 0 0 var(--space-sm);
    }
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: var(--space-md) var(--space-xl);
      padding: 0 var(--space-lg) var(--space-lg);
    }
    .detail-item { display: flex; flex-direction: column; gap: 2px; }
    .detail-item .label { font-size: 12px; color: var(--ink-mute); }
    .detail-item .value { font-size: 14px; color: var(--ink); word-break: break-all; white-space: pre-wrap; }
    .detail-actions {
      display: flex;
      gap: var(--space-md);
      padding: var(--space-lg);
      border-top: 1px solid var(--hairline);
    }
    /* 进展跟踪分区 */
    .progress-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: var(--space-sm);
      padding: var(--space-md) var(--space-lg) 0;
    }
    .progress-header h2 {
      font-size: 16px;
      font-weight: 500;
      color: var(--ink);
      margin: 0 0 var(--space-sm);
    }
    .progress-controls {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      font-size: 13px;
      color: var(--ink-secondary);
    }
    .progress-controls input[type="date"] {
      font-family: inherit;
      font-size: 13px;
      padding: 4px 8px;
      border: 1px solid var(--hairline-input);
      border-radius: var(--rounded-sm);
      background: var(--canvas);
      color: var(--ink);
    }
    .progress-timeline { padding: 0 var(--space-lg) var(--space-lg); }
    .timeline-item {
      border-left: 2px solid var(--primary);
      padding: 0 0 var(--space-md) var(--space-md);
      margin-left: 6px;
      position: relative;
    }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: -6px;
      top: 4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--primary);
    }
    .timeline-head {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      flex-wrap: wrap;
      margin-bottom: var(--space-xs);
    }
    .timeline-date { font-weight: 500; color: var(--ink); }
    .timeline-reporter { font-size: 13px; color: var(--ink-mute); }
    .timeline-label { font-size: 12px; color: var(--ink-mute); }
    .timeline-value {
      font-size: 14px;
      color: var(--ink);
      white-space: pre-wrap;
      word-break: break-all;
      margin-bottom: var(--space-xs);
    }
    .timeline-risk { color: var(--ruby); }
    .progress-empty { color: var(--ink-mute); font-size: 14px; padding: var(--space-md) 0; }
    /* 进展填报弹层 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-card {
      background: var(--canvas);
      border-radius: var(--rounded-sm);
      padding: var(--space-lg);
      width: 560px;
      max-width: 92vw;
      max-height: 88vh;
      overflow-y: auto;
    }
    .modal-card h3 { margin: 0 0 var(--space-md); font-size: 16px; color: var(--ink); }
    .modal-field { display: flex; flex-direction: column; gap: var(--space-xs); margin-bottom: var(--space-md); }
    .modal-field label { font-size: 13px; color: var(--ink-secondary); }
    .modal-field input[type="date"],
    .modal-field input[type="text"],
    .modal-field textarea {
      font-family: inherit;
      font-size: 14px;
      padding: var(--space-sm) var(--space-md);
      border: 1px solid var(--hairline-input);
      border-radius: var(--rounded-sm);
      background: var(--canvas);
      color: var(--ink);
      outline: none;
    }
    .modal-field input:focus,
    .modal-field textarea:focus { border-color: var(--primary); }
    .modal-field textarea { resize: vertical; line-height: 1.6; }
    .modal-tags { display: flex; gap: var(--space-lg); font-size: 14px; color: var(--ink); }
    .modal-actions { display: flex; gap: var(--space-md); justify-content: flex-end; }
    /* 问题列表分区 */
    .detail-issues { padding: 0 var(--space-lg) var(--space-lg); }
    .issue-row {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      padding: var(--space-xs) 0;
      border-bottom: 1px solid var(--hairline);
      font-size: 13px;
      flex-wrap: wrap;
    }
    .issue-row:last-child { border-bottom: none; }
    .issue-row .issue-no { color: var(--primary); }
    .issue-row .issue-title { color: var(--ink); flex: 1; min-width: 200px; }
    .issue-row .issue-due { color: var(--ink-mute); font-size: 12px; }
    .issues-empty { color: var(--ink-mute); font-size: 14px; padding: var(--space-md) 0; }
  </style>
</head>
<body>
  <div class="hero">
    <div class="hero-mesh" aria-hidden="true"></div>
    <div class="container hero-content">
      <header class="page-header">
        <div class="page-title">
          <h1 id="pageTitle">项目详情</h1>
          <p id="pageSubtitle"></p>
        </div>
        <a href="index.html" class="btn-secondary settings-btn">返回列表</a>
      </header>
    </div>
  </div>

  <main class="container">
    <div id="loading" class="loading card">加载中...</div>
    <div id="error" class="error card" style="display: none;"></div>

    <div id="detailCard" class="card" style="display: none;">
      <div id="detailBody"></div>

      <section id="progressSection" class="detail-section">
        <div class="progress-header">
          <h2>进展跟踪</h2>
          <div class="progress-controls">
            <input type="date" id="progressFrom" title="起始日期">
            <span>至</span>
            <input type="date" id="progressTo" title="结束日期">
            <button id="progressFilterBtn" class="btn-secondary">筛选</button>
            <button id="progressClearBtn" class="btn-secondary">清除</button>
            <button id="progressAddBtn" class="btn-primary">填报进展</button>
          </div>
        </div>
        <div id="progressError" class="error" style="display: none;"></div>
        <div id="progressTimeline" class="progress-timeline"></div>
      </section>

      <section id="issuesSection" class="detail-section">
        <div class="progress-header">
          <h2>问题列表</h2>
          <div class="progress-controls">
            <a id="issueAddLink" href="#" class="btn-primary">新建问题</a>
          </div>
        </div>
        <div id="issuesError" class="error" style="display: none;"></div>
        <div id="issuesList" class="detail-issues"></div>
      </section>

      <div id="detailBodyAfter"></div>
      <div class="detail-actions">
        <a id="editLink" href="#" class="btn-primary">编辑</a>
        <a href="index.html" class="btn-secondary">返回列表</a>
      </div>
    </div>

    <div id="progressModal" class="modal-overlay" style="display: none;">
      <div class="modal-card">
        <h3 id="progressModalTitle">填报进展</h3>
        <div id="progressModalError" class="error" style="display: none;"></div>
        <form id="progressForm">
          <div class="modal-field">
            <label for="pfReportDate">填报日期 *</label>
            <input type="date" id="pfReportDate" required>
          </div>
          <div class="modal-field">
            <label for="pfCompleted">完成内容 *</label>
            <textarea id="pfCompleted" rows="4" required></textarea>
          </div>
          <div class="modal-field">
            <label for="pfNextPlan">下阶段计划</label>
            <textarea id="pfNextPlan" rows="3"></textarea>
          </div>
          <div class="modal-field">
            <label for="pfRisk">风险说明</label>
            <textarea id="pfRisk" rows="2"></textarea>
          </div>
          <div class="modal-field">
            <label>标签</label>
            <div class="modal-tags">
              <label><input type="checkbox" class="progress-tag-cb" value="里程碑达成"> 里程碑达成</label>
              <label><input type="checkbox" class="progress-tag-cb" value="风险上升"> 风险上升</label>
              <label><input type="checkbox" class="progress-tag-cb" value="需领导决策"> 需领导决策</label>
            </div>
          </div>
          <div class="modal-field">
            <label for="pfReporter">填报人</label>
            <input type="text" id="pfReporter" placeholder="你的姓名">
          </div>
          <div class="modal-actions">
            <button type="submit" class="btn-primary">保存</button>
            <button type="button" id="progressCancelBtn" class="btn-secondary">取消</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="detail.js"></script>
</body>
</html>
