<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>设置 - 项目信息查询</title>
  <link rel="stylesheet" href="style.css?v=28">
  <link rel="stylesheet" href="nav.css?v=1">
</head>
<body>
  <div id="navContainer"></div>
  <div class="hero">
    <div class="hero-mesh" aria-hidden="true"></div>
    <div class="container hero-content">
      <div class="page-title">
        <h1>设置</h1>
        <p>本地归档、数据库连接与导出字段配置</p>
      </div>
    </div>
  </div>

  <main class="container settings-container">
    <section class="card settings-card">
      <div class="settings-card-header">
        <h2>本地归档</h2>
        <p>插件点击“提交到数据库”后，会自动归档下载的立项批复文件并生成字段 Excel。</p>
      </div>
      <div class="settings-form">
        <div class="settings-row">
          <label for="archiveFolder">归档文件夹</label>
          <input type="text" id="archiveFolder" placeholder="例如 C:\Users\xxx\Desktop\项目批复文件">
        </div>
        <div class="settings-row">
          <label for="downloadDir">浏览器默认下载目录</label>
          <input type="text" id="downloadDir" placeholder="例如 C:\Users\xxx\Downloads">
        </div>
      </div>
    </section>

    <section class="card settings-card">
      <div class="settings-card-header">
        <h2>数据库</h2>
        <p>网页与插件共用同一套数据库配置，修改后即时生效。</p>
      </div>
      <div class="settings-form">
        <div class="settings-row">
          <label for="dbHost">主机</label>
          <input type="text" id="dbHost" placeholder="localhost">
        </div>
        <div class="settings-row">
          <label for="dbPort">端口</label>
          <input type="number" id="dbPort" placeholder="3306">
        </div>
        <div class="settings-row">
          <label for="dbUser">用户名</label>
          <input type="text" id="dbUser" placeholder="root">
        </div>
        <div class="settings-row">
          <label for="dbPassword">密码</label>
          <input type="password" id="dbPassword" placeholder="">
        </div>
        <div class="settings-row">
          <label for="dbName">数据库名</label>
          <input type="text" id="dbName" placeholder="project_tracker">
        </div>
        <div class="settings-row settings-row-action">
          <label></label>
          <button type="button" id="testDbBtn" class="btn-secondary">测试连接</button>
          <span id="dbTestStatus" class="settings-status"></span>
        </div>
      </div>
    </section>

    <section class="card settings-card">
      <div class="settings-card-header">
        <h2>邮件催办</h2>
        <p>配置 SMTP 发件、IMAP 退信回收与催办策略。密码保存后不回显，留空表示不修改。</p>
      </div>
      <div class="settings-form">
        <div class="settings-row"><label for="smtpHost">SMTP 主机</label><input type="text" id="smtpHost" placeholder="smtp.example.com"></div>
        <div class="settings-row"><label for="smtpPort">SMTP 端口</label><input type="number" id="smtpPort" placeholder="465"></div>
        <div class="settings-row"><label for="smtpSecure">SMTP SSL</label><select id="smtpSecure"><option value="true">启用（465）</option><option value="false">关闭（25/587）</option></select></div>
        <div class="settings-row"><label for="smtpUser">SMTP 账号</label><input type="text" id="smtpUser" placeholder="noreply@example.com"></div>
        <div class="settings-row"><label for="smtpPass">SMTP 密码/授权码</label><input type="password" id="smtpPass" placeholder="留空表示不修改"></div>
        <div class="settings-row"><label for="mailFrom">发件人显示</label><input type="text" id="mailFrom" placeholder="项目跟踪 <noreply@example.com>"></div>

        <div class="settings-row"><label for="imapHost">IMAP 主机</label><input type="text" id="imapHost" placeholder="imap.example.com"></div>
        <div class="settings-row"><label for="imapPort">IMAP 端口</label><input type="number" id="imapPort" placeholder="993"></div>
        <div class="settings-row"><label for="imapSecure">IMAP SSL</label><select id="imapSecure"><option value="true">启用（993）</option><option value="false">关闭（143）</option></select></div>
        <div class="settings-row"><label for="imapUser">IMAP 账号</label><input type="text" id="imapUser" placeholder="noreply@example.com"></div>
        <div class="settings-row"><label for="imapPass">IMAP 密码/授权码</label><input type="password" id="imapPass" placeholder="留空表示不修改"></div>
        <div class="settings-row"><label for="imapMailbox">IMAP 邮箱</label><input type="text" id="imapMailbox" placeholder="INBOX"></div>
        <div class="settings-row"><label for="bounceScanEnabled">退信回收</label><select id="bounceScanEnabled"><option value="false">关闭</option><option value="true">开启</option></select></div>
        <div class="settings-row"><label for="cronBounce">退信扫描 cron</label><input type="text" id="cronBounce" placeholder="*/30 * * * *"></div>

        <div class="settings-row"><label for="leaderEmails">领导邮箱</label><input type="text" id="leaderEmails" placeholder="逗号分隔多个"></div>
        <div class="settings-row"><label for="publicBaseUrl">系统访问地址</label><input type="text" id="publicBaseUrl" placeholder="http://localhost:3000"></div>
        <div class="settings-row"><label for="escalationEnabled">催办总开关</label><select id="escalationEnabled"><option value="false">关闭</option><option value="true">开启</option></select></div>
        <div class="settings-row"><label for="sendOnWeekend">周末发送</label><select id="sendOnWeekend"><option value="false">不发送</option><option value="true">发送</option></select></div>
        <div class="settings-row"><label for="cronDaily">每日催办 cron</label><input type="text" id="cronDaily" placeholder="0 9 * * *"></div>
        <div class="settings-row"><label for="cronWeekly">每周提醒 cron</label><input type="text" id="cronWeekly" placeholder="0 9 * * 1"></div>

        <div class="settings-row settings-row-action">
          <label></label>
          <input type="text" id="testMailTo" placeholder="测试收件地址" style="max-width: 220px;">
          <button type="button" id="testMailBtn" class="btn-secondary">发送测试邮件</button>
          <span id="testMailStatus" class="settings-status"></span>
        </div>
      </div>
    </section>

    <section class="card settings-card">
      <div class="settings-card-header">
        <h2>导出字段</h2>
        <p>勾选需要在“项目信息查询”页面导出 Excel 时包含的字段。</p>
      </div>
      <div class="settings-row" style="align-items: flex-start;">
        <label style="padding-top: 4px;">导出字段</label>
        <div id="exportFields" class="export-fields"></div>
      </div>
    </section>

    <section class="card settings-card">
      <div class="settings-card-header">
        <h2>关注标签</h2>
        <p>配置“关注项目”页面可选的关注类型标签及颜色，添加、变更关注时勾选使用。</p>
      </div>
      <div class="settings-row" style="align-items: flex-start;">
        <label style="padding-top: 4px;">标签列表</label>
        <div class="watch-tags-area">
          <div id="watchTagsList" class="watch-tags-list"></div>
          <div class="watch-tags-add">
            <input type="text" id="newTagName" placeholder="新标签名称">
            <input type="color" id="newTagColor" value="#533afd">
            <button type="button" id="addTagBtn" class="btn-secondary">添加标签</button>
          </div>
        </div>
      </div>
    </section>

    <section class="card settings-save-card">
      <div class="settings-actions">
        <button type="button" id="saveSettingsBtn" class="btn-primary">保存设置</button>
        <span id="settingsStatus" class="settings-status"></span>
      </div>
    </section>
  </main>

  <script src="nav.js"></script>
  <script>
    Nav.render(document.getElementById('navContainer'), {
      current: 'settings',
      breadcrumb: [{ label: '首页', href: 'index.html' }, { label: '设置' }],
      actions: `<a href="index.html" class="btn-secondary">返回查询</a>`,
    });
  </script>
  <script src="settings.js?v=3"></script>
</body>
</html>
